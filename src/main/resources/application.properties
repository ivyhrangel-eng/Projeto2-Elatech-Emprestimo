spring.application.name=emprestimos

# Porta: no Render vem da variável PORT; no computador, 8080
server.port=${PORT:8080}

# Mostra a mensagem da regra quebrada na resposta de erro
spring.web.error.include-message=always

# Banco H2 salvo em arquivo na pasta "dados"
spring.datasource.url=jdbc:h2:file:./dados/emprestimos
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Tela do banco no navegador: http://localhost:8080/h2-console
# (no Render, desligar com a variável SPRING_H2_CONSOLE_ENABLED=false)
spring.h2.console.enabled=true
